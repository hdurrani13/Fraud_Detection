name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # The real dataset isn't in the repo, so tests use synthetic data with the same schema
      - run: pytest -q
      - name: Smoke-test training on synthetic data
        run: PYTHONPATH=src python -m fraud.train --synthetic --out /tmp/smoke
